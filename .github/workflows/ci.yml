name: PharmaForge OS - CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: "Backend Tests"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci-minimum-32-chars-long-xxxxx
      DEBUG: "true"
      TESTING: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run pytest
        run: pytest -v

  security-scan:
    name: "Dependency Security Scan"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit --desc --strict -r requirements.txt

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      - name: "Trivy: dependency vulnerability scan"
        run: |
          # Output results to JSON for annotation, then check exit code
          trivy fs --scanners vuln --severity HIGH,CRITICAL --skip-dirs infra --format json --output trivy-vuln.json . || true
          # Emit findings as annotations so they're visible via API
          python3 -c "
          import json, sys
          data = json.load(open('trivy-vuln.json'))
          found = False
          for result in data.get('Results', []):
              for vuln in result.get('Vulnerabilities', []):
                  found = True
                  pkg = vuln.get('PkgName','?')
                  ver = vuln.get('InstalledVersion','?')
                  fix = vuln.get('FixedVersion','?')
                  vid = vuln.get('VulnerabilityID','?')
                  sev = vuln.get('Severity','?')
                  print(f'::error title=Trivy {sev}: {vid}::{pkg}=={ver} (fix: {fix})')
          sys.exit(1 if found else 0)
          "

      - name: "Trivy: secret leak scan"
        run: trivy fs --scanners secret --severity HIGH,CRITICAL --skip-dirs infra --exit-code 1 .
